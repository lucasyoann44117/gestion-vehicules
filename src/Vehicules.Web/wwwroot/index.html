    <script>
        // Sur GitHub Pages, l'application est servie depuis /<dépôt>/ : on adapte la base.
        if (location.hostname.endsWith('github.io')) {
            const depot = location.pathname.split('/')[1];
            if (depot) document.querySelector('base').href = '/' + depot + '/';
        }

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">✕</span>
    </div>

    <script>
        // Télécharge un texte comme fichier (sauvegarde JSON).
        window.telecharger = (nom, texte) => {
            const url = URL.createObjectURL(new Blob([texte], { type: 'application/json' }));
            const a = Object.assign(document.createElement('a'), { href: url, download: nom });
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Mise à jour automatique : dès qu'une nouvelle version est publiée, elle s'installe et la page se recharge une fois.
        (function () {
            if (!('serviceWorker' in navigator)) return;
            const avaitUnControleur = !!navigator.serviceWorker.controller;
            let recharge = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!avaitUnControleur || recharge) return;
                recharge = true;
                location.reload();
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                const verifier = () => reg.update().catch(() => { });
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verifier(); });
                setInterval(verifier, 30 * 60 * 1000);
            });
        })();
    </script>
