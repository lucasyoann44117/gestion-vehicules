# Publie l'application sur GitHub Pages à chaque envoi sur « main » :
# compile, puis pousse le site sur la branche « gh-pages », que GitHub Pages sert.
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test GestionVehicules.slnx

      - name: Compilation
        run: dotnet publish src/Vehicules.Web -c Release -o sortie

      - name: Adaptation à GitHub Pages
        run: |
          # Les adresses comme /pieces renvoient l'application, qui affiche le bon écran.
          cp sortie/wwwroot/index.html sortie/wwwroot/404.html
          # Laisser passer les dossiers qui commencent par « _ » (_framework).
          touch sortie/wwwroot/.nojekyll
          # Jamais de données personnelles en ligne.
          rm -rf sortie/wwwroot/donnees

      - name: Envoi sur la branche gh-pages
        run: |
          cd sortie/wwwroot
          git init -q -b gh-pages
          git add -A
          git -c user.name="publication" -c user.email="publication@users.noreply.github.com" \
            commit -q -m "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
